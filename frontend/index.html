<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI for Everyone</title>
  <meta name="description"
    content="Interactive visualization of transformer attention heads, queries, and keys. Explore how attention flows between tokens layer by layer." />
  <meta name="theme-color" content="#f8fafc" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" />
  <script>
    // Apply the saved theme before first paint (see src/theme.tsx) to avoid a light flash.
    (function () {
      var dark = false;
      try { dark = localStorage.getItem("aife.theme") === "dark"; } catch (e) { }
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
